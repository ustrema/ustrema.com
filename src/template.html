<!doctype html>
<html lang="{{lang}}" class="{{html_class}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="en" href="https://ustrema.com/">
<link rel="alternate" hreflang="bg" href="https://ustrema.com/bg/">
<link rel="alternate" hreflang="x-default" href="https://ustrema.com/">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#1D1429">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ustrema">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:locale:alternate" content="{{og_locale_alt}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:image" content="https://ustrema.com/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og_alt}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{base}}assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{base}}assets/apple-touch-icon.png">
<link rel="manifest" href="{{base}}manifest.webmanifest">
<link rel="preload" href="{{base}}fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{base}}fonts/onest.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{base}}fonts/mono.woff2" as="font" type="font/woff2" crossorigin>
<script type="application/ld+json">{{jsonld}}</script>
<style>
@font-face{font-family:'Manrope';src:url('{{base}}fonts/manrope.woff2') format('woff2');font-weight:600 800;font-display:swap}
@font-face{font-family:'Onest';src:url('{{base}}fonts/onest.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('{{base}}fonts/mono.woff2') format('woff2');font-weight:500;font-display:swap}
/* Metric-matched fallbacks: no layout shift when the brand fonts swap in */
@font-face{font-family:'Manrope Fallback';src:local('Arial Bold'),local('Arial-BoldMT'),local('Liberation Sans Bold');size-adjust:102.81%;ascent-override:103.69%;descent-override:29.18%;line-gap-override:0%}
@font-face{font-family:'Onest Fallback';src:local('Arial'),local('ArialMT'),local('Liberation Sans');size-adjust:104.79%;ascent-override:92.57%;descent-override:29.11%;line-gap-override:0%}

:root{
  --ink:#1D1429; --cream:#F4F1EC; --cream-72:rgba(244,241,236,.72); --cream-58:rgba(244,241,236,.58); --cream-16:rgba(244,241,236,.16);
  --magenta:#E847C9; --on-magenta:#1D1429;
  --f-display:'Manrope','Manrope Fallback',Arial,sans-serif; --f-text:'Onest','Onest Fallback',Arial,sans-serif; --f-mono:'JetBrains Mono',Menlo,'Courier New',monospace;
  --ease:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.55,0,1,.45);
  --gutter:clamp(16px,5vw,96px);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--ink);color:var(--cream);font-family:var(--f-text);font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--magenta);color:var(--on-magenta)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cream);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;z-index:10;background:var(--cream);color:var(--ink);padding:10px 14px;font-weight:600;text-decoration:none}
.skip:focus{top:16px}

/* Layers: field 0, content 2 */
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none;opacity:0;transition:opacity 1.4s cubic-bezier(.22,1,.36,1)}
#field.on{opacity:1}

.stage{position:relative;z-index:2;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(20px,3.4vw,44px) var(--gutter) clamp(20px,3vw,36px);max-width:1680px;margin:0 auto}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.label{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-72);display:flex;align-items:center;gap:14px;margin:0}
.pulse{display:flex;align-items:flex-end;gap:3px;height:16px}
.pulse i{display:block;width:5px;height:16px;background:var(--cream);transform-origin:bottom;clip-path:polygon(0 2.9px,100% 0,100% 100%,0 100%);animation:pulse 2.4s var(--ease) infinite both}
.pulse i:nth-child(1){animation-delay:0s;opacity:.45}.pulse i:nth-child(2){animation-delay:.16s;opacity:.7}.pulse i:nth-child(3){animation-delay:.32s}
@keyframes pulse{0%,100%{transform:scaleY(.3)}45%,60%{transform:scaleY(1)}}
.lang{display:flex;gap:2px;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em}
.lang a{display:block;padding:12px 10px;color:var(--cream-58);text-decoration:none;position:relative;transition:color .3s var(--ease)}
.lang a[aria-current="page"]{color:var(--cream)}
.lang a[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:2px;background:var(--cream)}
.lang a:hover{color:var(--cream)}

/* Hero */
.hero{align-self:center;padding:clamp(40px,7vh,96px) 0 clamp(32px,6vh,72px);max-width:880px}
.logo{position:relative;width:clamp(210px,31vw,470px);aspect-ratio:602.67/117.7;margin:0 0 clamp(36px,6vh,64px) -.4%}
.logo-3d{position:absolute;inset:0}
.logo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.logo .lt,.logo .hook{color:var(--cream)}
.logo .blade{color:var(--magenta)}
/* Drawn by hand: each part is traced as an outline, then fills in as the outline fades.
   Final state lives in the base styles, so reduced motion simply shows the finished logo. */
.logo path{fill:currentColor;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:1;stroke-opacity:0;
  animation:draw 2.3s cubic-bezier(.45,0,.25,1) var(--d,0s) both}
.logo .blade{--d:.15s}
.logo .hook{--d:.35s}
.logo .lt{--d:calc(.6s + var(--i) * 95ms)}
@keyframes draw{
  0%{stroke-dashoffset:1;stroke-opacity:1;fill-opacity:0}
  62%{stroke-dashoffset:0;stroke-opacity:1;fill-opacity:0}
  100%{stroke-dashoffset:0;stroke-opacity:0;fill-opacity:1}
}

h1{font-family:var(--f-display);font-weight:800;font-size:clamp(42px,6.4vw,96px);letter-spacing:-.035em;line-height:1.02;margin:0;max-width:12ch;text-wrap:balance}
h1 .wi{display:inline-block;animation:word 1.4s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(1.05s + var(--i) * 90ms)}
@keyframes word{from{transform:translateY(.22em);opacity:.04}to{transform:none;opacity:1}}
.sub{font-size:clamp(17px,1.35vw,20px);line-height:1.5;color:var(--cream-72);max-width:44ch;margin:clamp(20px,3vh,28px) 0 0}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:20px 32px;margin-top:clamp(32px,5vh,48px)}
.in{animation:in 1.3s cubic-bezier(.22,1,.36,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.d1{animation-delay:1.3s}.d2{animation-delay:1.45s}.d3{animation-delay:1.6s}

.btn-wrap{display:inline-block;transition:transform .6s var(--ease)}
.btn{position:relative;display:inline-flex;align-items:center;gap:14px;padding:19px 30px 19px 32px;background:var(--cream);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap;isolation:isolate;overflow:hidden;
  clip-path:polygon(14px 0,100% 0,100% 100%,0 100%,0 8.08px)}
.btn::before{content:"";position:absolute;inset:-2px -60px;background:var(--magenta);z-index:-1;transform:translateX(-101%) skewX(-60deg);transform-origin:left;transition:transform .7s var(--ease)}
.btn:hover::before,.btn:focus-visible::before{transform:translateX(0) skewX(-60deg)}
.btn:active{transform:scale(.98)}
.btn .arr{display:inline-block;transition:transform .5s var(--ease)}
.btn:hover .arr{transform:translateX(5px)}
.btn:focus-visible{outline:none}
.btn-wrap:focus-within{outline:2px solid var(--cream);outline-offset:4px}

.mail{margin:0;display:flex;align-items:center;gap:14px;font-family:var(--f-mono);font-weight:500;font-size:15px}
.copy{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-58);padding:10px 2px 8px;border-bottom:1px solid var(--cream-16);transition:color .3s var(--ease),border-color .3s var(--ease);min-width:9ch;min-height:24px;text-align:left}
.copy:hover,.copy[data-state="done"]{color:var(--cream);border-color:var(--cream)}

/* Footer */
.foot{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px 48px;align-items:end;padding-top:24px}
.tabs{display:flex;flex-wrap:wrap;margin:0 0 10px;padding:0;list-style:none}
.tabs button{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-58);padding:10px 0 12px;margin-right:26px;position:relative;transition:color .3s var(--ease)}
.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:2px;background:var(--cream);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.tabs button[aria-pressed="true"]{color:var(--cream)}
.tabs button[aria-pressed="true"]::after{transform:scaleX(1)}
.tabs button:hover{color:var(--cream)}
.door{font-family:var(--f-display);font-weight:600;font-size:clamp(17px,1.5vw,22px);letter-spacing:-.015em;line-height:1.3;min-height:2.6em;max-width:36ch;margin:0}
.door span{display:inline-block}
.meta{justify-self:end;text-align:right;font-size:13px;color:var(--cream-58);line-height:1.6;max-width:46ch;margin:0}
.meta{text-shadow:0 0 6px var(--ink),0 0 14px var(--ink)}
.meta .who{color:var(--cream-72);display:block}
.meta small{display:block;font-size:11.5px;margin-top:6px}

/* Logo in the header: a compact brand mark, so the headline carries the hero */
.logo--sm{width:clamp(112px,9.5vw,142px);margin:0}
.hero .label{margin:0 0 clamp(18px,3vh,28px)}
/* Logo as the hero: the line underneath steps back to a quieter subtitle */
.lead h1{font-weight:600;font-size:clamp(24px,2.9vw,42px);letter-spacing:-.025em;line-height:1.15;color:var(--cream-72);max-width:24ch}
.lead .logo{width:clamp(250px,40vw,600px);margin-bottom:clamp(24px,4vh,40px)}


@media (max-width:767px){
  #field.on{opacity:.5}
  .hero{padding:32px 0 28px}
  h1{max-width:none}
  .foot{grid-template-columns:1fr}
  .meta{justify-self:start;text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">{{skip}}</a>
{{preview_bar}}
<canvas id="field" aria-hidden="true"></canvas>

<div class="stage">
  <header class="top in d3">
    {{header_left}}
    <nav class="lang" aria-label="{{lang_label}}">
      {{lang_links}}
    </nav>
  </header>

  <main class="hero" id="main">
    {{hero_top}}

    <h1>{{h1_words}}</h1>
    <p class="sub in d1">{{sub}}</p>

    <div class="cta in d2">
      <span class="btn-wrap" id="mag"><a class="btn" href="mailto:hello@ustrema.com?subject={{subject}}">{{cta}}<span class="arr" aria-hidden="true">→</span></a></span>
      <p class="mail">
        <span>hello@ustrema.com</span>
        <button type="button" class="copy" id="copy" aria-describedby="copy-status">{{copy}}</button>
        <span class="sr" id="copy-status" role="status"></span>
      </p>
    </div>
  </main>

  <footer class="foot in d3">
    <section aria-label="{{doors_label}}">
      <ul class="tabs">
        <li><button type="button" data-door="0" aria-pressed="true">{{d0t}}</button></li>
        <li><button type="button" data-door="1" aria-pressed="false">{{d1t}}</button></li>
        <li><button type="button" data-door="2" aria-pressed="false">{{d2t}}</button></li>
      </ul>
      <p class="door" id="door"><span>{{door0}}</span></p>
    </section>
    <p class="meta">
      <span class="who">{{who}}</span>
      <small>{{tm}}</small>
    </p>
  </footer>
</div>

<script>
(() => {
  const DOORS = {{doors_json}};
  const COPY = {{copy_json}};
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine = matchMedia('(pointer: fine)').matches;
  const EASE = 'cubic-bezier(.16,1,.3,1)', EASE_IN = 'cubic-bezier(.55,0,1,.45)';

  /* ---------- Copy email ---------- */
  const copyBtn = document.getElementById('copy'), status = document.getElementById('copy-status');
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText('hello@ustrema.com'); } catch (e) { return; }
    copyBtn.textContent = COPY.done; copyBtn.dataset.state = 'done'; status.textContent = COPY.status;
    clearTimeout(copyBtn._t);
    copyBtn._t = setTimeout(() => { copyBtn.textContent = COPY.idle; copyBtn.dataset.state = ''; status.textContent = ''; }, 1800);
  });

  /* ---------- Govern / Build / Scale with AI ---------- */
  const door = document.getElementById('door'), tabs = [...document.querySelectorAll('[data-door]')];
  let cur = 0, manual = false, paused = false;
  function show(i){
    cur = i;
    tabs.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
    const old = door.firstElementChild;
    const swap = () => {
      door.innerHTML = '<span></span>'; door.firstElementChild.textContent = DOORS[i];
      if (!reduce) door.firstElementChild.animate([{ opacity: 0, transform: 'translate(-9px,16px)' }, { opacity: 1, transform: 'none' }], { duration: 700, easing: EASE });
    };
    if (reduce) return swap();
    old.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translate(8px,-14px)' }], { duration: 320, easing: EASE_IN, fill: 'forwards' }).finished.then(swap);
  }
  tabs.forEach(b => b.addEventListener('click', () => { manual = true; show(+b.dataset.door); }));
  const sec = door.parentElement;
  ['pointerenter', 'focusin'].forEach(e => sec.addEventListener(e, () => paused = true));
  ['pointerleave', 'focusout'].forEach(e => sec.addEventListener(e, () => paused = false));
  if (!reduce) setInterval(() => { if (!manual && !paused && !document.hidden) show((cur + 1) % 3); }, 5200);

  /* ---------- Magnetic CTA ---------- */
  if (fine && !reduce){
    const mag = document.getElementById('mag');
    mag.addEventListener('pointermove', e => {
      const r = mag.getBoundingClientRect();
      mag.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .2}px,${(e.clientY - r.top - r.height / 2) * .28}px)`;
    });
    mag.addEventListener('pointerleave', () => { mag.style.transform = ''; });
  }

  /* ---------- Background field ----------
     One canvas, several calm modes built from the logo's own geometry (the u and its 30° cut).
     Starts when the page is idle, drops to 30 fps on slow devices, and shows a still frame
     under prefers-reduced-motion. */
  const MODE = {{mode_json}};
  const cv = document.getElementById('field');
  const ctx = cv.getContext('2d', { alpha: false });
  const HOOK = new Path2D('M0.20 25.45L28.10 41.56L28.10 70.01C28.10 86.95 43.56 100.67 62.62 100.67C72.09 100.67 80.67 97.29 86.90 91.81C76.48 107.48 60.54 117.50 42.68 117.50C19.22 117.50 0.20 98.20 0.20 74.39L0.20 25.45Z');
  const BLADE = new Path2D('M60.30 19.71L94.10 0.20L94.10 63.76C94.10 78.31 78.97 90.10 60.30 90.10L60.30 19.71Z');
  const VB = { x: .2, y: .2, w: 93.9, h: 117.3 };
  const C30 = Math.cos(Math.PI / 6), S30 = Math.sin(Math.PI / 6), T30 = Math.tan(Math.PI / 6);
  const INK = [29, 20, 41];
  const probe = document.createElement('canvas').getContext('2d');
  const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const layer = () => { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; const g = c.getContext('2d'); g.scale(DPR, DPR); return [c, g]; };
  let W, H, DPR, mob, U;

  // Where the big u sits: right side on desktop, bottom-right and quieter on phones
  function placeU(){
    const uh = mob ? Math.min(H * .6, W * 1.1) : Math.min(H * .94, W * .42 * VB.h / VB.w);
    const uw = uh * VB.w / VB.h;
    U = { w: uw, h: uh, x: mob ? W - uw * .7 : W - uw - W * .045, y: mob ? H - uh * .8 : H - uh * .9 };
  }
  function inU(x, y){
    const vx = VB.x + (x - U.x) / U.w * VB.w, vy = VB.y + (y - U.y) / U.h * VB.h;
    if (vx < 0 || vx > 95 || vy < 0 || vy > 118) return 0;
    return probe.isPointInPath(BLADE, vx, vy) ? 2 : probe.isPointInPath(HOOK, vx, vy) ? 1 : 0;
  }
  function uClip(g, path){
    g.save(); g.translate(U.x, U.y); g.scale(U.w / VB.w, U.h / VB.h); g.translate(-VB.x, -VB.y); g.clip(path); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  const modes = {
    /* Pin field: the u built from 30° blades riding a slow wave. Calm variant: no pointer, dimmer, slower. */
    pins: (() => {
      const TONES = MODE.calm
        ? [[[36, 28, 47], [60, 52, 68]], [[37, 29, 49], [74, 66, 82]], [[44, 25, 50], [84, 33, 80]]]
        : [[[38, 30, 49], [92, 84, 99]], [[44, 35, 56], [118, 110, 124]], [[54, 27, 60], [124, 44, 116]]];
      const DL = 36, DTOP = 1.25, SPD = MODE.calm ? .55 : 1;
      let P, S, CUT, DMAX, cells, grid, atlas, sprites;
      const ptr = { x: -1e4, y: -1e4, tx: -1e4, ty: -1e4, on: 0, k: 0 }, ripples = [];
      function buildAtlas(){
        const zMax = DTOP * DMAX, cw = Math.ceil(S + zMax * C30 + 3), ch = Math.ceil(S + zMax * S30 + 3);
        atlas = document.createElement('canvas'); atlas.width = Math.ceil(cw * DL * DPR); atlas.height = Math.ceil(ch * 3 * DPR);
        const g = atlas.getContext('2d'); g.scale(DPR, DPR);
        const poly = (pts, col) => { g.fillStyle = col; g.beginPath(); pts.forEach(([x, y], j) => j ? g.lineTo(x, y) : g.moveTo(x, y)); g.fill(); };
        sprites = TONES.map(([lo, hi], m) => Array.from({ length: DL }, (_, i) => {
          const d = (i + 1) / DL * DTOP, z = d * DMAX, ox = z * C30, oy = z * S30, f = mix(lo, hi, Math.min(1, d / 1.05));
          const bx = i * cw, by = m * ch;
          g.save(); g.translate(bx + 1, by + oy + 1);
          poly([[0, S], [S, S], [S + ox, S - oy], [ox, S - oy]], rgb(mix(INK, f, .38)));
          poly([[0, CUT], [0, S], [ox, S - oy], [ox, CUT - oy]], rgb(mix(INK, f, .66)));
          poly([[ox, CUT - oy], [S + ox, -oy], [S + ox, S - oy], [ox, S - oy]], rgb(f));
          g.restore();
          const w = S + ox + 2, hh = S + oy + 2;
          return { sx: bx * DPR, sy: by * DPR, sw: w * DPR, sh: hh * DPR, w, h: hh, dy: -oy - 1 };
        }));
      }
      if (MODE.interact && !reduce){
        addEventListener('pointermove', e => { ptr.tx = e.clientX; ptr.ty = e.clientY; if (!ptr.on){ ptr.x = ptr.tx; ptr.y = ptr.ty; ptr.on = 1; } }, { passive: true });
        document.documentElement.addEventListener('pointerleave', () => ptr.on = 0);
        addEventListener('pointerdown', e => { ripples.push({ x: e.clientX, y: e.clientY, t: performance.now() }); if (ripples.length > 4) ripples.shift(); }, { passive: true });
      }
      return {
        init(){
          P = Math.max(12, U.w / (mob ? 15 : 23)); S = P * .64; CUT = S * T30; DMAX = P * (MODE.calm ? 1.25 : 1.55);
          const c0 = Math.floor(-U.x / P) - 1, c1 = Math.ceil((W - U.x) / P) + 1, r0 = Math.floor(-U.y / P) - 1, r1 = Math.ceil((H - U.y) / P) + 2;
          cells = [];
          for (let r = r0; r <= r1; r++) for (let c = c1; c >= c0; c--){       // painter's order: rows down, columns right→left
            const x = U.x + c * P + (P - S) / 2, y = U.y + r * P + (P - S) / 2, cx = x + S / 2, cy = y + S / 2;
            const m = inU(U.x + (c + .5) * P, U.y + (r + .5) * P);
            if (!m && !MODE.interact) continue;
            const along = (x * C30 - y * S30) / P;
            cells.push({ x, y, cx, cy, m, along, a1: along * .3, a2: (cx * .19 + cy * .27) / P + Math.random() * 2.2 });
          }
          let lo = Infinity, hi = -Infinity;
          for (const k of cells) if (k.m){ lo = Math.min(lo, k.along); hi = Math.max(hi, k.along); }
          for (const k of cells) k.delay = k.m ? .05 + (k.along - lo) / (hi - lo || 1) * .75 : .8;
          let g; [grid, g] = layer();
          g.fillStyle = rgb(INK); g.fillRect(0, 0, W, H);
          if (MODE.interact){
            g.fillStyle = 'rgba(244,241,236,.09)'; g.beginPath();
            for (const k of cells) if (!k.m) g.rect(k.cx - .8, k.cy - .8, 1.6, 1.6);
            g.fill();
          }
          buildAtlas();
        },
        draw(t, now){
          ptr.x += (ptr.tx - ptr.x) * .14; ptr.y += (ptr.ty - ptr.y) * .14; ptr.k += ((ptr.on ? 1 : 0) - ptr.k) * .06;
          const sig2 = 2 * (P * 3.3) ** 2, rw2 = 2 * (P * 1.3) ** 2, pk = ptr.k > .01;
          for (let i = ripples.length - 1; i >= 0; i--) if (now - ripples[i].t > 2600) ripples.splice(i, 1);
          const fieldOn = Math.min(1, Math.max(0, (t - .5) * 2)), wt1 = t * 1.15 * SPD, wt2 = t * .72 * SPD;
          ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(grid, 0, 0); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          for (const k of cells){
            let lift = 0;
            if (pk){ const dx = k.cx - ptr.x, dy = k.cy - ptr.y, q = dx * dx + dy * dy; if (q < sig2 * 4) lift = Math.exp(-q / sig2) * .95 * ptr.k; }
            for (const rp of ripples){
              const dx = k.cx - rp.x, dy = k.cy - rp.y, age = (now - rp.t) / 1000, off = Math.sqrt(dx * dx + dy * dy) - age * 820;
              if (off * off < rw2 * 9) lift += Math.exp(-(off * off) / rw2) * Math.exp(-age * 1.5) * .85;
            }
            let d;
            if (k.m){
              const p = Math.min(1, Math.max(0, (t - k.delay) / .85)), e = 1 - (1 - p) ** 4;
              d = (.3 + (Math.sin(k.a1 - wt1) * .5 + .5) * .3 + Math.sin(k.a2 - wt2) * .08 + (k.m === 2 ? .14 : 0) + lift * .7) * e;
            } else d = lift * fieldOn;
            if (d < .05) continue;
            const sp = sprites[k.m][Math.min(DL - 1, Math.max(0, Math.round(d / DTOP * DL) - 1))];
            ctx.drawImage(atlas, sp.sx, sp.sy, sp.sw, sp.sh, k.x - 1, k.y + sp.dy, sp.w, sp.h);
          }
        }
      };
    })(),

    /* Current: nested u outlines (the logo's bowl, repeated) drifting slowly outward from one centre. */
    arcs: (() => {
      let cx, cy, gap, maxR;
      return {
        init(){ cx = mob ? W * .82 : W * .76; cy = mob ? H * .62 : H * .42; gap = mob ? 30 : 44; maxR = Math.hypot(Math.max(cx, W - cx), H) * 1.05; },
        draw(t){
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          ctx.fillStyle = rgb(INK); ctx.fillRect(0, 0, W, H);
          const phase = (t * 9) % gap, n = Math.ceil(maxR / gap) + 1, on = Math.min(1, t / 1.2);
          ctx.lineWidth = .7;
          for (let i = 0; i < n; i++){
            const r = i * gap + phase; if (r < 2) continue;
            const fadeIn = Math.min(1, r / (gap * 3)), fadeOut = Math.max(0, 1 - r / maxR);
            const accent = i % 7 === 3;                                         // one quiet magenta current in seven
            const a = (accent ? .24 : .13) * fadeIn * fadeOut * on;
            ctx.strokeStyle = accent ? `rgba(232,71,201,${a})` : `rgba(244,241,236,${a})`;
            ctx.beginPath();
            ctx.moveTo(cx - r, -4); ctx.lineTo(cx - r, cy);
            ctx.ellipse(cx, cy, r, r * .86, 0, Math.PI, 0, true);
            ctx.lineTo(cx + r, -4);
            ctx.stroke();
          }
        }
      };
    })(),

    /* Horizon: a row of 30°-cut blades along the bottom, rising to the right, breathing slowly.
       A soft magenta tint travels through them: momentum passing along the line. */
    horizon: (() => {
      let bw, step, n;
      return {
        init(){ bw = mob ? 9 : Math.max(10, W / 110); step = bw * 1.7; n = Math.ceil(W / step) + 1; },
        draw(t){
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          ctx.fillStyle = rgb(INK); ctx.fillRect(0, 0, W, H);
          const cut = bw * T30, hl = ((t * .055) % 1.25) - .12, on = Math.min(1, t / 1.4);
          for (let i = 0; i < n; i++){
            const x = i * step, u = x / W, trend = Math.pow(u, 1.5);
            const breathe = .78 + .16 * Math.sin(i * .19 - t * .7) + .06 * Math.sin(i * .57 + t * .45);
            const h = H * (mob ? .2 : .25) * (.05 + .95 * trend) * breathe * Math.min(1, on * 1.2 - u * .2 + .2);
            if (h < 2) continue;
            const k = Math.min(1, trend * .9 + .1);
            const glow = Math.exp(-((u - hl) ** 2) / .004);
            let col = mix([37, 29, 49], [70, 62, 78], k);
            col = mix(col, [104, 34, 96], glow * .8);
            ctx.fillStyle = rgb(col);
            const y = H - h;
            ctx.beginPath(); ctx.moveTo(x, y + cut); ctx.lineTo(x + bw, y); ctx.lineTo(x + bw, H); ctx.lineTo(x, H); ctx.fill();
          }
        }
      };
    })(),

    /* Sheen: the u drawn in 30° hairlines; a slow band of light sweeps across it every few seconds. */
    lines: (() => {
      let dim, bright, x0, x1;
      function hatch(g, col){
        g.strokeStyle = col; g.lineWidth = 1; g.beginPath();
        const L = (W + H) * 1.5, sp = mob ? 11 : 13;
        for (let x = -L; x < W + L; x += sp){ g.moveTo(x, H + 20); g.lineTo(x + L * C30, H + 20 - L * S30); }
        g.stroke();
      }
      function paint(g, a){
        uClip(g, HOOK); hatch(g, `rgba(244,241,236,${a})`); g.restore();
        uClip(g, BLADE); hatch(g, `rgba(232,71,201,${a * 1.25})`); g.restore();
      }
      return {
        init(){
          let g;
          [dim, g] = layer(); g.fillStyle = rgb(INK); g.fillRect(0, 0, W, H); paint(g, .16);
          [bright, g] = layer(); paint(g, .62);
          x0 = U.x - H * .6 - 160; x1 = U.x + U.w + 160;
        },
        draw(t){
          ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dim, 0, 0);
          const cyc = 8.5, sweep = 5.5, p = ((t + 4.2) % cyc) / sweep;
          if (p > 1) return;
          const e = p < .5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2;
          const bx = x0 + (x1 - x0) * e, lean = H * T30;
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          for (const [hw, a] of [[110, .28], [60, .38], [24, .5]]){
            ctx.save(); ctx.globalAlpha = a; ctx.beginPath();
            ctx.moveTo(bx - hw, H); ctx.lineTo(bx + hw, H); ctx.lineTo(bx + hw + lean, 0); ctx.lineTo(bx - hw + lean, 0); ctx.clip();
            ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bright, 0, 0); ctx.restore();
          }
          ctx.globalAlpha = 1;
        }
      };
    })(),

    /* Signal: a dot grid across the whole page; the big u is drawn in larger dots that breathe in a
       slow, smooth wave along the 30° axis. Where the cursor passes, nearby dots wake slowly and join
       their grid neighbours with hairlines, forming faint squares that fade out behind it. */
    dots: (() => {
      const B = 14, ATTACK = .35, RELEASE = 1.2;
      let p, cols, rows, gu, base, upts, E, stamp, act, inAct, L1, L2, frame = 0, lastT = 0;
      const ptr = { x: -1e4, y: -1e4, moved: -1e9, in: 0 };
      const LINE = [0, 1].map(m => Array.from({ length: B }, (_, i) => m ? `rgba(232,71,201,${((i + 1) / B * .1).toFixed(3)})` : `rgba(244,241,236,${((i + 1) / B * .08).toFixed(3)})`));
      const DOT = [0, 1].map(m => Array.from({ length: B }, (_, i) => m ? `rgba(232,71,201,${((i + 1) / B * .8).toFixed(3)})` : `rgba(244,241,236,${((i + 1) / B * .8).toFixed(3)})`));
      const lb = [[], []].map(() => Array.from({ length: B }, () => []));
      const db = [[], []].map(() => Array.from({ length: B }, () => []));
      if (!reduce){
        addEventListener('pointermove', e => {
          if (e.pointerType !== 'mouse') return;
          ptr.x = e.clientX; ptr.y = e.clientY; ptr.moved = performance.now(); ptr.in = 1;
        }, { passive: true });
        document.documentElement.addEventListener('pointerleave', () => ptr.in = 0);
      }
      const dot = (m, al, x, y, r) => { if (al > .012) db[m][Math.min(B - 1, Math.floor(al / .8 * B))].push(x, y, r); };
      return {
        init(){
          p = mob ? 13 : 16; cols = Math.ceil(W / p); rows = Math.ceil(H / p);
          const n = cols * rows;
          gu = new Uint8Array(n); E = new Float32Array(n); stamp = new Uint32Array(n); inAct = new Uint8Array(n); act = [];
          L1 = new Int32Array(n).fill(-1); L2 = new Int32Array(n).fill(-1);
          upts = [];
          let g; [base, g] = layer();
          g.fillStyle = rgb(INK); g.fillRect(0, 0, W, H);
          g.fillStyle = 'rgba(244,241,236,.07)'; g.beginPath();
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
            const i = r * cols + c, x = p / 2 + c * p, y = p / 2 + r * p, m = inU(x, y);
            gu[i] = m;
            if (m) upts.push({ i, x, y, m, a: (x * C30 - y * S30) / p, d: 0 });
            else g.rect(x - .75, y - .75, 1.5, 1.5);
            if (c + 1 < cols) L1[i] = i + 1;          // right neighbour
            if (r + 1 < rows) L2[i] = i + cols;       // neighbour below: together they draw squares
          }
          g.fill();
          let lo = Infinity, hi = -Infinity;
          for (const q of upts){ lo = Math.min(lo, q.a); hi = Math.max(hi, q.a); }
          for (const q of upts) q.d = (q.a - lo) / (hi - lo || 1);
          lastT = 0;
        },
        draw(t, now){
          const dt = Math.min(.05, Math.max(0, t - lastT)); lastT = t; frame++;
          const up = 1 - Math.exp(-dt / ATTACK), down = 1 - Math.exp(-dt / RELEASE);
          const R = mob ? 110 : 150, wt = t * .45;
          for (const b of lb) for (const l of b) l.length = 0;
          for (const b of db) for (const l of b) l.length = 0;
          // energy: rises slowly near the exact cursor position, releases even more slowly
          if (ptr.in && now - ptr.moved < 1600){
            const c0 = Math.max(0, Math.floor((ptr.x - R) / p)), c1 = Math.min(cols - 1, Math.ceil((ptr.x + R) / p));
            const r0 = Math.max(0, Math.floor((ptr.y - R) / p)), r1 = Math.min(rows - 1, Math.ceil((ptr.y + R) / p));
            for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){
              const i = r * cols + c, dx = p / 2 + c * p - ptr.x, dy = p / 2 + r * p - ptr.y, d = Math.sqrt(dx * dx + dy * dy);
              if (d >= R) continue;
              const f = 1 - d / R, target = f * f * (3 - 2 * f);
              E[i] += (target - E[i]) * (target > E[i] ? up : down);
              stamp[i] = frame;
              if (!inAct[i] && E[i] > .003){ inAct[i] = 1; act.push(i); }
            }
          }
          for (let k = act.length - 1; k >= 0; k--){
            const i = act[k];
            if (stamp[i] !== frame) E[i] -= E[i] * down;
            if (E[i] < .003){ E[i] = 0; inAct[i] = 0; act[k] = act[act.length - 1]; act.pop(); }
          }
          ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(base, 0, 0); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          // the web
          for (const i of act){
            const e = E[i], c = i % cols, r = (i / cols) | 0;
            for (const j of [L1[i], L2[i]]){
              if (j < 0 || !E[j]) continue;
              const al = Math.sqrt(e * E[j]) * .08; if (al < .004) continue;
              const m = gu[i] === 2 && gu[j] === 2 ? 1 : 0;
              lb[m][Math.min(B - 1, Math.floor(al / .08 * B))].push(i, j);
            }
            if (!gu[i]) dot(0, .07 + .1 * e, p / 2 + c * p, p / 2 + r * p, .8 + .25 * e);
          }
          // the u: continuous size and brightness, eased; the web adds a touch where it overlaps
          for (const q of upts){
            const on = Math.min(1, Math.max(0, (t - .3 - q.d * 1.2) / 1.6)); if (on <= 0) continue;
            const oe = on * on * on * (on * (on * 6 - 15) + 10);                 // smootherstep
            const w = Math.sin(q.a * .15 - wt) * .5 + .5, e = w * w * (3 - 2 * w);
            dot(q.m - 1, (.17 + .38 * e + .15 * E[q.i]) * oe, q.x, q.y, (.9 + 1.1 * e + .4 * E[q.i]) * (.5 + .5 * oe));
          }
          ctx.lineWidth = .7;
          for (let m = 0; m < 2; m++) for (let bi = 0; bi < B; bi++){
            const l = lb[m][bi]; if (!l.length) continue;
            ctx.strokeStyle = LINE[m][bi]; ctx.beginPath();
            for (let k = 0; k < l.length; k += 2){
              const a = l[k], b = l[k + 1];
              ctx.moveTo(p / 2 + (a % cols) * p, p / 2 + ((a / cols) | 0) * p); ctx.lineTo(p / 2 + (b % cols) * p, p / 2 + ((b / cols) | 0) * p);
            }
            ctx.stroke();
          }
          for (let m = 0; m < 2; m++) for (let bi = 0; bi < B; bi++){
            const l = db[m][bi]; if (!l.length) continue;
            ctx.fillStyle = DOT[m][bi]; ctx.beginPath();
            for (let k = 0; k < l.length; k += 3){ ctx.moveTo(l[k] + l[k + 2], l[k + 1]); ctx.arc(l[k], l[k + 1], l[k + 2], 0, 6.2832); }
            ctx.fill();
          }
        }
      };
    })()

  };
  const field = modes[MODE.name];

  let raf = 0, rT, running = false, t0 = 0, slow = 0, skip = false, avg = 8;
  const loop = now => {
    raf = requestAnimationFrame(loop);
    if (slow && (skip = !skip)) return;                      // adaptive: 30 fps when frames run slow
    const s = performance.now(); field.draw((now - t0) / 1000, now);
    avg = avg * .9 + (performance.now() - s) * .1;
    if (avg > 10) slow = 1; else if (avg < 4) slow = 0;
  };
  function layout(){
    mob = innerWidth < 768; DPR = Math.min(devicePixelRatio || 1, mob ? 1.5 : 2);
    W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    placeU(); field.init();
  }
  function start(){
    if (!innerWidth || !innerHeight){ addEventListener('resize', start, { once: true }); return; }   // hidden tab: wait for a real size
    layout();                                                  // task 1: build the grid
    requestAnimationFrame(() => {                              // task 2: first frame, then the loop
      t0 = performance.now() - (reduce ? 4000 : 0);
      field.draw((performance.now() - t0) / 1000, performance.now());
      cv.classList.add('on');
      if (reduce) return;
      running = true; raf = requestAnimationFrame(loop);
    });
  }
  addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (!t0) return; layout(); field.draw((performance.now() - t0) / 1000, performance.now()); }, 150); });
  document.addEventListener('visibilitychange', () => {
    if (!running) return;
    cancelAnimationFrame(raf);
    if (!document.hidden) raf = requestAnimationFrame(loop);
  });
  // Start once the page has loaded and the main thread is idle: it never competes with first paint.
  const idle = window.requestIdleCallback || (f => setTimeout(f, 200));
  const boot = () => idle(start, { timeout: 1000 });
  if (document.readyState === 'complete') boot(); else addEventListener('load', boot, { once: true });
})();
</script>
</body>
</html>
